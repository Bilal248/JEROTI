[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeroti"
version = "0.1.0"
description = "System anomaly detection (training + real-time detection)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"joblib>=1.3",
	"numpy>=1.26",
	"pandas>=2.2",
	"psutil>=5.9",
	"scikit-learn>=1.4",
	"streamlit>=1.36",
	"click>=8.1",
	"python-dotenv>=1.0",
]

[project.scripts]
jeroti = "cli:main"

[tool.setuptools]
py-modules = ["cli", "main", "realtime", "runner", "train"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*"]
exclude = ["__pycache__*"]
